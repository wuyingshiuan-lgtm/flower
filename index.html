<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ff77ad"><title>花花名冊</title><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",sans-serif;background:linear-gradient(160deg,#fff4fa,#fffbe9 48%,#efffea);color:#553447;min-height:100vh}.app{max-width:520px;margin:auto;padding:18px 14px 100px}.hero{background:linear-gradient(135deg,#ff79ad,#ffb34f);color:white;border-radius:26px;padding:20px;box-shadow:0 8px 24px #ff87ad45;position:relative;overflow:hidden}.hero:after{content:"🌸 🌼 🌷";position:absolute;right:10px;top:8px;font-size:25px;opacity:.7}.hero h1{margin:0 0 5px;font-size:27px}.hero p{margin:0;font-size:14px}.toolbar{display:grid;grid-template-columns:1fr auto;gap:8px;margin:15px 0}.search{width:100%;border:2px solid #ffc4d9;border-radius:16px;padding:13px 14px;font-size:16px;outline:none;background:white}.btn{border:0;border-radius:15px;padding:12px 15px;font-weight:800;font-size:15px;cursor:pointer}.primary{background:#ff5e9c;color:white}.yellow{background:#ffd75e;color:#684a00}.green{background:#62d6a4;color:#164d3a}.muted{background:#f6e8ef;color:#75465e}.topBtns{display:flex;gap:8px;margin-bottom:14px}.topBtns .btn{flex:1}.empty{text-align:center;padding:38px 15px;color:#9b6d83}.card{background:#fff;border:2px solid #ffd4e3;border-radius:23px;margin:12px 0;padding:12px;box-shadow:0 6px 18px #d96d9d1c}.photo{height:210px;border-radius:17px;background:#fff0f6;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:60px}.photo img{width:100%;height:100%;object-fit:cover}.flowerName{font-size:23px;font-weight:900;margin:11px 4px 5px;color:#d93e7d}.owners{margin:4px;font-size:15px;line-height:1.8}.tag{display:inline-block;background:#fff0a8;border-radius:999px;padding:4px 9px;margin:2px;font-weight:700}.actions{display:flex;gap:8px;margin-top:10px}.actions .btn{flex:1}.modal{display:none}.modal.show{display:block}.inlineForm{display:block!important;position:static!important;background:transparent!important;margin:14px 0}.inlineForm .sheet{border-radius:24px!important;box-shadow:0 6px 18px #d96d9d1c;border:2px solid #ffd4e3;padding:16px!important;max-height:none!important}.sheet{background:#fff;width:100%;max-width:520px;margin:auto;border-radius:28px 28px 0 0;padding:20px 16px max(22px,env(safe-area-inset-bottom));max-height:90vh;overflow:auto}.sheet h2{margin:0 0 15px;color:#d93e7d}.field{margin:13px 0}.field label{display:block;font-weight:800;margin-bottom:7px}.field input[type=text]{width:100%;border:2px solid #ffd1e1;border-radius:14px;padding:12px;font-size:16px}.checks{display:grid;grid-template-columns:1fr 1fr;gap:8px}.check{background:#fff4f8;border:2px solid #ffd3e3;border-radius:14px;padding:11px;display:flex;gap:8px;align-items:center;font-weight:700}.check input{width:21px;height:21px;accent-color:#ff5e9c}.preview{height:145px;background:#fff2f7;border-radius:16px;display:flex;align-items:center;justify-content:center;overflow:hidden;color:#b27b91}.preview{border:0;width:100%;cursor:pointer;position:relative}.preview img{width:100%;height:100%;object-fit:cover;transition:transform .15s ease}.photoPick{font:inherit}.sizeControl{background:#fff4f8;border:2px solid #ffd3e3;border-radius:16px;padding:10px 12px;margin-top:9px}.sizeControl label{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}.sizeControl input{width:100%;accent-color:#ff5e9c}.footerBtns{display:flex;gap:8px;margin-top:18px}.footerBtns .btn{flex:1}.ownerRow{display:flex;gap:8px;margin:8px 0;align-items:center;background:#fff4f8;padding:9px;border-radius:14px}.ownerRow span{flex:1;font-weight:800}.ownerAdd{display:flex;gap:8px}.ownerAdd input{flex:1;border:2px solid #ffd1e1;border-radius:14px;padding:11px;font-size:16px}.count{font-size:13px;color:#9d6b83;margin:0 3px 7px}
</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><main class="app"><section class="hero"><h1>🌷 花花名冊</h1><p>收藏每一朵可愛的花與它的主人 ♡</p></section><div class="toolbar" style="grid-template-columns:1fr"><input id="search" class="search" placeholder="🔍 搜尋花名或擁有人"></div><button type="button" class="btn primary" style="width:100%;margin-bottom:10px" onclick="resetForm()">🌸 清空表單／新增另一筆</button><div class="topBtns"><button class="btn yellow" onclick="openOwners()">👥 擁有人管理</button><button class="btn green" onclick="document.getElementById('search').value='';render()">🌼 顯示全部</button></div><div id="count" class="count"></div><div id="list"></div></main>
<div id="flowerModal" class="modal inlineForm"><div class="sheet"><h2 id="formTitle">🌸 新增花花</h2><div class="field"><label>花名</label><input id="flowerName" type="text" placeholder="例如：玫瑰"></div><div class="field"><label>花朵圖片</label><input id="flowerImage" type="file" accept="image/*" onchange="loadImage(event)" style="display:none"><button id="preview" type="button" class="preview photoPick" onclick="document.getElementById('flowerImage').click()" aria-label="選擇手機照片">🌷 選擇手機照片</button><div id="sizeControl" class="sizeControl" style="display:none"><label for="imageScale">照片大小 <output id="imageScaleValue">100%</output></label><input id="imageScale" type="range" min="60" max="140" step="5" value="100" oninput="changeScale(this.value)"></div></div><div class="field"><label>👤 擁有人（可複選）</label><div id="ownerChecks" class="checks"></div></div><div class="footerBtns"><button class="btn muted" onclick="resetForm()">清空</button><button class="btn primary" onclick="saveFlower()">🌷 儲存花花</button></div></div></div>
<div id="ownersModal" class="modal"><div class="sheet"><h2>👥 擁有人管理</h2><div class="ownerAdd"><input id="newOwner" type="text" placeholder="輸入擁有人姓名"><button class="btn primary" onclick="addOwner()">新增</button></div><div id="ownerList" style="margin-top:14px"></div><div class="footerBtns"><button class="btn muted" onclick="closeOwners()">完成</button></div></div></div>
<script>
const K1='flower_mobile_records_v1',K2='flower_mobile_owners_v1';
function safeGet(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function safeSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
let flowers=safeGet(K1,[]),owners=safeGet(K2,['嘻嘻','米豆','小燕','小語','語婕']),edit=-1,tempImage='',imageScale=100,cloudReady=false;
const SUPABASE_URL='https://qprzfciypaiwvbkiiapo.supabase.co',SUPABASE_KEY='sb_publishable_Bmn5OtlbGuGqQC4x0dNv7A_9_zldV2B',db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
function persist(){safeSet(K1,flowers);safeSet(K2,owners);if(cloudReady)flowers.forEach(syncFlower)}
async function loadCloud(){try{let r=await db.from('flower_records').select('*').order('created_at',{ascending:false});if(r.error)throw r.error;cloudReady=true;if((r.data||[]).length===0&&flowers.length){flowers=flowers.map(f=>({...f,id:f.id||crypto.randomUUID()}));for(const f of flowers)await syncFlower(f)}else{flowers=(r.data||[]).map(x=>({id:x.id,name:x.name,image:x.image_data||'',imageScale:Number(x.image_scale)||100,owners:Array.isArray(x.owners)?x.owners:[]}))}safeSet(K1,flowers);render()}catch(e){console.warn('cloud sync unavailable',e)}}
async function syncFlower(f){if(!cloudReady)return;let r=await db.from('flower_records').upsert({id:f.id||crypto.randomUUID(),name:f.name,image_data:f.image||null,image_scale:Number(f.imageScale)||100,owners:f.owners||[]});if(r.error)console.warn(r.error)}
async function removeCloud(id){if(!cloudReady||!id)return;let r=await db.from('flower_records').delete().eq('id',id);if(r.error)console.warn(r.error)}function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function render(){let q=document.getElementById('search').value.trim().toLowerCase(),a=flowers.filter(x=>x.name.toLowerCase().includes(q)||x.owners.some(o=>o.toLowerCase().includes(q)));document.getElementById('count').textContent=`共 ${a.length} 筆花花資料`;document.getElementById('list').innerHTML=a.length?a.map(x=>{let i=flowers.indexOf(x);return `<article class="card"><div class="photo">${x.image?`<img src="${x.image}" style="transform:scale(${Number(x.imageScale)||100}/100)">`:'🌸'}</div><div class="flowerName">${esc(x.name)}</div><div class="owners">擁有人：${x.owners.length?x.owners.map(o=>`<span class="tag">${esc(o)}</span>`).join(''):'尚未設定'}</div><div class="actions"><button class="btn yellow" onclick="openFlower(${i})">✏️ 修改</button><button class="btn muted" onclick="delFlower(${i})">🗑️ 刪除</button></div></article>`}).join(''):'<div class="empty">🌼<br><b>目前還沒有花花資料</b><br>按「＋新增」建立第一筆吧！</div>'}
function checks(sel=[]){document.getElementById('ownerChecks').innerHTML=owners.length?owners.map(o=>`<label class="check"><input type="checkbox" value="${esc(o)}" ${sel.includes(o)?'checked':''}>${esc(o)}</label>`).join(''):'<div style="grid-column:1/-1;color:#a77b8f">請先到「擁有人管理」新增姓名。</div>'}
function updateImagePreview(){let p=document.getElementById('preview');p.innerHTML=tempImage?'<img src="'+tempImage+'" style="transform:scale('+(imageScale/100)+')">':'🌷 選擇手機照片';document.getElementById('sizeControl').style.display=tempImage?'block':'none';document.getElementById('imageScale').value=imageScale;document.getElementById('imageScaleValue').textContent=imageScale+'%'}function changeScale(v){imageScale=Number(v)||100;updateImagePreview()}function openFlower(i){if(typeof i==='undefined')i=-1;edit=i;var x=i>=0?flowers[i]:null;document.getElementById('formTitle').textContent=x?'🌷 修改花花':'🌸 新增花花';document.getElementById('flowerName').value=x?x.name:'';tempImage=x&&x.image?x.image:'';imageScale=x&&x.imageScale?Number(x.imageScale):100;updateImagePreview();checks(x&&x.owners?x.owners:[]);document.getElementById('flowerModal').scrollIntoView({behavior:'smooth',block:'start'})}
function closeFlower(){resetForm()}function resetForm(){edit=-1;tempImage='';imageScale=100;document.getElementById('formTitle').textContent='🌸 新增花花';document.getElementById('flowerName').value='';document.getElementById('flowerImage').value='';updateImagePreview();checks([]);document.body.style.overflow=''}function loadImage(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{tempImage=r.result;imageScale=100;updateImagePreview()};r.readAsDataURL(f)}
function saveFlower(){let name=document.getElementById('flowerName').value.trim();if(!name)return alert('請輸入花名 🌸');let selected=[...document.querySelectorAll('#ownerChecks input:checked')].map(x=>x.value),old=edit>=0?flowers[edit]:null,obj={id:old&&old.id?old.id:(crypto.randomUUID?crypto.randomUUID():String(Date.now())),name,image:tempImage,imageScale:Number(imageScale)||100,owners:selected};if(edit>=0)flowers[edit]=obj;else flowers.unshift(obj);persist();syncFlower(obj);closeFlower();render()}
function delFlower(i){let f=flowers[i];if(confirm(`確定要刪除「${f.name}」嗎？`)){flowers.splice(i,1);persist();removeCloud(f.id);render()}}
function openOwners(){renderOwners();document.getElementById('ownersModal').classList.add('show')}function closeOwners(){document.getElementById('ownersModal').classList.remove('show');render()}function renderOwners(){document.getElementById('ownerList').innerHTML=owners.length?owners.map((o,i)=>`<div class="ownerRow"><span>🌼 ${esc(o)}</span><button class="btn yellow" onclick="renameOwner(${i})">修改</button><button class="btn muted" onclick="removeOwner(${i})">刪除</button></div>`).join(''):'<div class="empty">尚未建立擁有人</div>'}
function addOwner(){let n=document.getElementById('newOwner').value.trim();if(!n)return;if(owners.includes(n))return alert('這個姓名已經有了');owners.push(n);document.getElementById('newOwner').value='';persist();renderOwners()}function renameOwner(i){let old=owners[i],answer=prompt('修改擁有人姓名',old),n=answer?answer.trim():'';if(!n||n===old)return;if(owners.includes(n))return alert('這個姓名已經有了');owners[i]=n;flowers.forEach(f=>f.owners=f.owners.map(o=>o===old?n:o));persist();renderOwners()}function removeOwner(i){let n=owners[i];if(confirm(`刪除「${n}」？花花資料中的此擁有人也會移除。`)){owners.splice(i,1);flowers.forEach(f=>f.owners=f.owners.filter(o=>o!==n));persist();renderOwners()}}
document.getElementById('search').addEventListener('input',render);checks([]);render();loadCloud();
</script></body></html>
