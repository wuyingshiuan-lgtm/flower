<script>
const K1='flower_mobile_records_v1',K2='flower_mobile_owners_v1';
function safeGet(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function safeSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
let flowers=safeGet(K1,[]),owners=safeGet(K2,['嘻嘻','米豆','小燕','小語','語婕']),edit=-1,tempImage='',cropper=null,batchItems=[],batchCroppers=[],cloudReady=false,currentView='all',selectedOwner='';
const SUPABASE_URL='https://qprzfciypaiwvbkiiapo.supabase.co',SUPABASE_KEY='sb_publishable_Bmn5OtlbGuGqQC4x0dNv7A_9_zldV2B',db=window.supabase?.createClient(SUPABASE_URL,SUPABASE_KEY);
function persist(){safeSet(K1,flowers);safeSet(K2,owners);if(cloudReady)flowers.forEach(syncFlower)}
async function loadCloud(){if(!db)return;try{let r=await db.from('flower_records').select('*').order('created_at',{ascending:false});if(r.error)throw r.error;cloudReady=true;let local=Array.isArray(flowers)?flowers:[],cloud=(r.data||[]).map(x=>({id:x.id,name:x.name,image:x.image_data||'',imageScale:Number(x.image_scale)||100,owners:Array.isArray(x.owners)?x.owners:[]}));let merged=[],seen=new Set();for(const f of [...local,...cloud]){let key=String(f.name||'').trim().toLowerCase();if(!key||seen.has(key))continue;seen.add(key);merged.push({...f,id:f.id||(crypto.randomUUID?crypto.randomUUID():String(Date.now()+merged.length))})}flowers=merged;safeSet(K1,flowers);render();for(const f of flowers)await syncFlower(f)}catch(e){console.warn('cloud sync unavailable',e);render()}}

async function removeCloud(id){if(!cloudReady||!id)return;let r=await db.from('flower_records').delete().eq('id',id);if(r.error)console.warn(r.error)}function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function render(){let q=document.getElementById('search').value.trim().toLowerCase(),a=flowers.filter(x=>(!selectedOwner||(x.owners||[]).includes(selectedOwner))&&(String(x.name||'').toLowerCase().includes(q)||(x.owners||[]).some(o=>o.toLowerCase().includes(q))));let filters=document.getElementById('ownerFilters');filters.hidden=currentView!=='buy';filters.innerHTML=currentView==='buy'?['',...owners].map((o,i)=>`<button type="button" class="btn ${selectedOwner===o?'green':'muted'}" onclick="selectOwner(${i-1})">${o?esc(o):'全部'}</button>`).join(''):'';document.getElementById('count').textContent=`共 ${a.length} 筆花花資料`;document.getElementById('list').hidden=currentView==='manage';document.getElementById('count').hidden=currentView==='manage';document.getElementById('list').innerHTML=a.length?a.map(x=>{let i=flowers.indexOf(x);return `<article class="card"><button type="button" class="cardOpen" onclick="openFlower(${i})" aria-label="查看或修改${esc(x.name)}"><div class="photo">${x.image?`<img src="${x.image}" alt="${esc(x.name)}">`:'🌸'}</div><div class="flowerName">${esc(x.name)}</div><div class="owners">🧺 找她買：${x.owners.length?x.owners.map(o=>`<span class="tag">${esc(o)}</span>`).join('、'):'尚未設定'} <span class="cardArrow">❯</span></div></button>${currentView==='manage'?`<div class="actions"><button class="btn yellow" onclick="openFlower(${i})">✏️ 修改</button><button class="btn muted" onclick="delFlower(${i})">🗑️ 刪除</button></div>`:''}</article>`}).join(''):'<div class="empty">🌼<br><b>目前還沒有花花資料</b><br>按「新增一筆」建立第一筆吧！</div>'}

function closeFlower(){document.getElementById('flowerModal').classList.remove('show');document.body.style.overflow='';resetForm()}function resetForm(){edit=-1;tempImage='';if(cropper){cropper.destroy();cropper=null}document.getElementById('formTitle').textContent='🌸 新增花花';document.getElementById('flowerName').value='';document.getElementById('flowerImage').value='';updateImagePreview();checks([])}
async function ocrFlowerName(image){
  if(!window.Tesseract)return '';
  for(const lang of ['chi_tra','chi_sim']){
    try{
      let r=await Tesseract.recognize(image,lang,{langPath:'https://tessdata.projectnaptha.com/4.0.0'});
      let n=extractFlowerName(r.data.text);
      if(n)return n;
    }catch(e){}
  }
  return '';
}
async function recognizeUploadedName(data){
  let input=document.getElementById('flowerName');
  input.placeholder='正在辨識圖片上的花名，請稍候…';
  try{
    let name=await ocrFlowerName(data);
    if(!name){
      let im=await new Promise((resolve,reject)=>{let x=new Image();x.onload=()=>resolve(x);x.onerror=reject;x.src=data});
      let cv=document.createElement('canvas'),cx=cv.getContext('2d');cv.width=im.height*2;cv.height=im.width*2;cx.translate(cv.width/2,cv.height/2);cx.rotate(Math.PI/2);cx.drawImage(im,-im.width,-im.height,im.width*2,im.height*2);
      name=await ocrFlowerName(cv.toDataURL('image/png'));
    }
    if(name&&!input.value)input.value=name;
    input.placeholder=name?'已自動帶入花名，可直接修改':'未辨識到花名，請確認後再儲存';
  }catch(e){input.placeholder='未辨識到花名，請確認後再儲存'}
}
function loadImage(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{tempImage=r.result;document.getElementById('flowerName').value='';updateImagePreview();initCropper(tempImage);setTimeout(()=>{if(cropper)recognizeUploadedName(cropper.getCroppedCanvas({width:1200,height:1200,imageSmoothingQuality:'high'}).toDataURL('image/png'))},700)};r.readAsDataURL(f)}
function renderBatchOwners(){document.getElementById('batchOwnerChecks').innerHTML=owners.map(o=>'<label class="check"><input type="checkbox" value="'+esc(o)+'">'+esc(o)+'</label>').join('')}function renderBatchList(){document.getElementById('batchList').innerHTML=batchItems.map((b,i)=>'<div class="batchItem"><div class="batchCropStage"><img id="batchCropImage'+i+'" src="'+tempImage+'" alt="第'+(i+1)+'朵花裁切"></div><input id="batchName'+i+'" value="" placeholder="花名辨識中，可直接修改" aria-label="第'+(i+1)+'朵花名"></div>').join('')}function initBatchCroppers(img){batchCroppers.forEach(x=>x.destroy());batchCroppers=[];let specs=[{cx:.5,cy:.42,side:.38},{cx:.26,cy:.68,side:.38},{cx:.74,cy:.68,side:.38}];specs.forEach((s,i)=>{let el=document.getElementById('batchCropImage'+i),cp;cp=new Cropper(el,{viewMode:1,dragMode:'move',aspectRatio:1,autoCropArea:.72,cropBoxResizable:false,background:false,responsive:true,restore:false,zoomable:true,zoomOnWheel:true,ready(){let side=Math.min(img.naturalWidth,img.naturalHeight)*s.side,x=Math.max(0,Math.min(img.naturalWidth-side,s.cx*img.naturalWidth-side/2)),y=Math.max(0,Math.min(img.naturalHeight-side,s.cy*img.naturalHeight-side/2));cp.setData({x,y,width:side,height:side})}});batchCroppers.push(cp)})}function extractFlowerName(text){
  let raw=text||'',ignore=['已售罄','搜尋花朵','搜索花朵','禮包花園','購買個','重新辨識','三種花','花朵圖片','擁有人','訂單價格','訂單經驗','鮮花收穫','收穫間隔','單次收穫','精華掉落','偷取保底','升級','進階','花朵等級','花朵'];
  let lines=raw.split(/\\n+/).map(x=>x.replace(/[^\\u3400-\\u9fff]/g,'')).filter(x=>x.length>=2&&x.length<=14);
  let candidates=lines.filter(x=>!ignore.some(v=>x.includes(v)));
  let score=x=>(/(花|蘭|蓮|菊|梅|桂|玫瑰|牡丹|鳶尾|福祿考|長壽|格桑|蝶舞|麥冬|雨蒙)/.test(x)?100:0)+Math.min(x.length,10);
  if(candidates.length)return candidates.sort((a,b)=>score(b)-score(a))[0];
  let compact=raw.replace(/[^\\u3400-\\u9fff]/g,'');
  let known=['輕紫格桑花','冰藍蝶舞玫瑰','霜色麥冬花','藕粉長壽花','姑蘇雨蒙','仙女散花','飛黃玉蘭','橙星花福祿考','紺紫肖鳶尾'];
  return known.find(x=>compact.includes(x))||'';
}async function recognizeBatchNames(){let status=document.getElementById('batchStatus');if(!window.Tesseract||!batchCroppers.length){status.textContent='花名辨識服務尚未準備好，請稍後再按一次';return}status.textContent='正在依照三個裁切框重新辨識花名，請稍候…';try{for(let i=0;i<3;i++){let input=document.getElementById('batchName'+i);input.value='';let canvas=batchCroppers[i].getCroppedCanvas({width:900,height:900,imageSmoothingQuality:'high'}),r=await Tesseract.recognize(canvas,'chi_tra'),name=extractFlowerName(r.data.text);batchItems[i].name=name;input.value=name}status.textContent='辨識完成；若有空白或錯字，可直接修改後儲存'}catch(e){status.textContent='辨識未完成，請直接輸入花名後儲存'}}function openBatchFlowers(){if(!tempImage)return;let img=new Image();img.onload=()=>{batchItems=[{name:''},{name:''},{name:''}];renderBatchList();renderBatchOwners();document.getElementById('batchStatus').textContent='請把花盆底部／圖片底線對準每個黃色提示線；裁切框大小不可修改，儲存時保留原圖';document.getElementById('batchModal').classList.add('show');initBatchCroppers(img);setTimeout(()=>recognizeBatchNames(),1200)};img.src=tempImage}function closeBatchFlowers(){batchCroppers.forEach(x=>x.destroy());batchCroppers=[];document.getElementById('batchModal').classList.remove('show')}async function removeBackground(dataUrl,outSize=600){
  return new Promise(resolve=>{
    let im=new Image();
    im.onload=()=>{
      try{
        let w=im.naturalWidth||im.width,h=im.naturalHeight||im.height,cv=document.createElement('canvas'),cx=cv.getContext('2d');
        cv.width=w;cv.height=h;cx.drawImage(im,0,0,w,h);
        let d=cx.getImageData(0,0,w,h),p=d.data,seen=new Uint8Array(w*h),q=[],samples=[],removed=0;
        for(let x=0;x<w;x+=Math.max(1,Math.floor(w/24))){samples.push([p[x*4],p[x*4+1],p[x*4+2]]);let j=((h-1)*w+x)*4;samples.push([p[j],p[j+1],p[j+2]])}
        for(let y=0;y<h;y+=Math.max(1,Math.floor(h/24))){let j=(y*w)*4;samples.push([p[j],p[j+1],p[j+2]]);j=(y*w+w-1)*4;samples.push([p[j],p[j+1],p[j+2]])}
        let close=(i,s)=>{
          let dr=p[i]-s[0],dg=p[i+1]-s[1],db=p[i+2]-s[2];
          return dr*dr+dg*dg+db*db<65*65
        };
        let add=(x,y)=>{if(x<0||y<0||x>=w||y>=h)return;let n=y*w;if(seen[n+x])return;let i=n*4;if(p[i+3]<8||samples.some(s=>close(i,s))){seen[n+x]=1;q.push([x,y])}};
        for(let x=0;x<w;x++){add(x,0);add(x,h-1)} for(let y=0;y<h;y++){add(0,y);add(w-1,y)}
        for(let z=0;z<q.length;z++){let [x,y]=q[z],n=y*w+x,i=n*4;if(p[i+3]>0)removed++;p[i+3]=0;add(x+1,y);add(x-1,y);add(x,y+1);add(x,y-1)}
        if(removed>w*h*.9)return resolve(dataUrl);cx.putImageData(d,0,0);
        let out=document.createElement('canvas'),ox=out.getContext('2d');out.width=out.height=outSize;ox.clearRect(0,0,outSize,outSize);ox.drawImage(cv,0,0,w,h,0,0,outSize,outSize);resolve(out.toDataURL('image/png'))
      }catch(e){resolve(dataUrl)}
    };
    im.onerror=()=>resolve(dataUrl);im.src=dataUrl
  })
}
async function saveBatchFlowers(){let names=[0,1,2].map(i=>document.getElementById('batchName'+i).value.trim());if(names.some(x=>!x))return alert('請確認三個花名都有填寫 🌸');let normalized=names.map(x=>x.toLowerCase());if(new Set(normalized).size!==names.length)return alert('三個花名中有重複，請確認後再儲存 🌸');let duplicate=flowers.find(f=>normalized.includes(String(f.name||'').trim().toLowerCase()));if(duplicate)return alert('已有「'+duplicate.name+'」資料，不能重複新增 🌸');let selected=[...document.querySelectorAll('#batchOwnerChecks input:checked')].map(x=>x.value);for(let i=0;i<3;i++){let b=batchItems[i];b.name=names[i];b.image=batchCroppers[i].getCroppedCanvas({width:600,height:600,imageSmoothingQuality:'high'}).toDataURL('image/jpeg',.92);b.owners=selected;b.id=crypto.randomUUID?crypto.randomUUID():String(Date.now()+i);flowers.unshift(b)}persist();batchItems=[];closeBatchFlowers();resetForm();render()}async function saveFlower(){let name=document.getElementById('flowerName').value.trim();if(!name)return alert('請輸入花名 🌸');let duplicate=flowers.find((f,i)=>i!==edit&&String(f.name||'').trim().toLowerCase()===name.toLowerCase());if(duplicate)return alert('已有「'+duplicate.name+'」資料，不能重複新增 🌸');let selected=[...document.querySelectorAll('#ownerChecks input:checked')].map(x=>x.value),old=edit>=0?flowers[edit]:null;if(cropper)tempImage=cropper.getCroppedCanvas({width:600,height:600,imageSmoothingQuality:'high'}).toDataURL('image/jpeg',.92);let obj={id:old&&old.id?old.id:(crypto.randomUUID?crypto.randomUUID():String(Date.now())),name,image:tempImage,owners:selected};if(edit>=0)flowers[edit]=obj;else flowers.unshift(obj);persist();closeFlower();render()}
function delFlower(i){let f=flowers[i];if(confirm(`確定要刪除「${f.name}」嗎？`)){flowers.splice(i,1);persist();removeCloud(f.id);render()}}
function openOwners(){setView('manage')}function closeOwners(){setView('all')}function renderOwners(){document.getElementById('ownerList').innerHTML=owners.length?owners.map((o,i)=>`<div class="ownerRow"><span>🌼 ${esc(o)}</span><button class="btn yellow" onclick="renameOwner(${i})">修改</button><button class="btn muted" onclick="removeOwner(${i})">刪除</button></div>`).join(''):'<div class="empty">尚未建立找她買</div>'}
function addOwner(){let n=document.getElementById('newOwner').value.trim();if(!n)return;if(owners.includes(n))return alert('這個姓名已經有了');owners.push(n);document.getElementById('newOwner').value='';persist();renderOwners()}function renameOwner(i){let old=owners[i],answer=prompt('修改找她買姓名',old),n=answer?answer.trim():'';if(!n||n===old)return;if(owners.includes(n))return alert('這個姓名已經有了');owners[i]=n;flowers.forEach(f=>f.owners=f.owners.map(o=>o===old?n:o));persist();renderOwners()}function removeOwner(i){let n=owners[i];if(confirm(`刪除「${n}」？花花資料中的此找她買資料也會移除。`)){owners.splice(i,1);flowers.forEach(f=>f.owners=f.owners.filter(o=>o!==n));persist();renderOwners()}}
document.getElementById('search').addEventListener('input',render);checks([]);render();loadCloud();
</script><script>
