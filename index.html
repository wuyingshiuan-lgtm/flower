/* Iridescent powder frame with a slow shifting gleam. */
.card{border:4px solid transparent!important;border-radius:24px!important;background:linear-gradient(160deg,#fffdfcf5,#fff7fff4 55%,#ebfbfff5) padding-box,linear-gradient(125deg,#ff8ad4,#fff2a1,#75efff,#ab83ff,#ff83d5,#fff0aa) border-box!important;box-shadow:inset 0 0 0 2px #fff,0 0 0 2px #ffffffd9,0 0 12px #fff,0 0 18px #a9faffaa,0 7px 18px #7181df66!important;animation:auroraCardGlow 5.5s ease-in-out infinite alternate}
@keyframes auroraCardGlow{0%{filter:brightness(1);box-shadow:inset 0 0 0 2px #fff,0 0 0 2px #ffffffd9,0 0 10px #fff,0 0 15px #a9faff88,0 7px 18px #7181df55}100%{filter:brightness(1.035);box-shadow:inset 0 0 0 2px #fff,0 0 0 2px #fff,0 0 14px #fff,0 0 22px #ff9deaaa,0 8px 20px #7181df77}}
.card:before,.card:after,.cardOpen:before,.cardOpen:after{filter:drop-shadow(0 0 7px #fff) drop-shadow(0 0 5px #ff9cdb)!important}
.photo{box-shadow:0 0 0 2px #96f4ff,0 0 14px #fff, inset 0 0 12px #fff!important}
@media(max-width:600px){.artHero{aspect-ratio:1024/490!important}.brandTitle{width:66%!important;top:12%!important}.brandRibbon{top:68%!important}}

.brandRibbon{display:flex!important;align-items:center!important;justify-content:center!important;gap:clamp(5px,1.2vw,12px)!important}
.brandRibbon .ribbonFlower{font-size:clamp(17px,2.7vw,27px)!important;filter:drop-shadow(0 1px 3px #ff70c6)!important;-webkit-text-fill-color:initial!important;background:none!important}
.brandRibbon .ribbonWords{display:inline-flex;align-items:center;white-space:nowrap;background:none!important;color:#ef369b!important;-webkit-text-fill-color:initial!important;-webkit-background-clip:border-box!important;background-clip:border-box!important;filter:drop-shadow(0 1px 2px #ff94d3)!important}
.brandRibbon .ribbonWords b{display:inline-block;padding:0 .015em;font-family:"LXGW WenKai TC","Wawati TC","HanziPen TC","DFKai-SB",cursive!important;font-size:clamp(17px,2.85vw,30px)!important;font-weight:900!important;line-height:1.12!important;-webkit-text-stroke:.7px #fff!important;text-shadow:0 1px 0 #fff,0 2px 0 #d69cbd,0 0 6px #fff!important}
.brandRibbon .ribbonWords b:nth-child(6n+1){color:#ed318f!important;-webkit-text-fill-color:#ed318f!important;text-shadow:0 1px 0 #fff,0 2px 0 #d92a7e,0 0 7px #ff8bca!important}
.brandRibbon .ribbonWords b:nth-child(6n+2){color:#ff8b19!important;-webkit-text-fill-color:#ff8b19!important;text-shadow:0 1px 0 #fff,0 2px 0 #d77813,0 0 7px #ffd26b!important}
.brandRibbon .ribbonWords b:nth-child(6n+3){color:#df47dc!important;-webkit-text-fill-color:#df47dc!important;text-shadow:0 1px 0 #fff,0 2px 0 #a533b1,0 0 7px #f9a5ff!important}
.brandRibbon .ribbonWords b:nth-child(6n+4){color:#087fdd!important;-webkit-text-fill-color:#087fdd!important;text-shadow:0 1px 0 #fff,0 2px 0 #165bab,0 0 7px #8ceaff!important}
.brandRibbon .ribbonWords b:nth-child(6n+5){color:#25a93f!important;-webkit-text-fill-color:#25a93f!important;text-shadow:0 1px 0 #fff,0 2px 0 #187e32,0 0 7px #b8ff8a!important}

/* Keep the fixed artwork inside the page stacking context and behind content. */
html,body{background:transparent!important;isolation:isolate}
body:before{z-index:0!important;position:fixed!important;inset:0!important;width:100vw;height:100vh;height:100dvh;background-image:url('flower-background.webp'),url('flower-background.webp'),linear-gradient(180deg,#d4f8ff,#d9eaff 58%,#ffe7f7)!important;background-size:min(100vw,1024px) auto,min(100vw,1024px) 100vh,min(100vw,1024px) 100dvh!important;background-position:center top,center top,center top!important;background-repeat:no-repeat!important;background-attachment:fixed!important;transform:translateZ(0);will-change:transform}
.shell{position:relative;z-index:1;background:transparent!important;isolation:isolate;overflow:visible}
/* Responsive pearl garden dock and a viewport-fixed background */
html{min-height:100%;scroll-padding-bottom:calc(110px + env(safe-area-inset-bottom))}
body{min-height:100vh;min-height:100dvh;overflow-x:hidden}
body:before{position:fixed!important;inset:0!important;height:100vh;height:100dvh;background-attachment:fixed!important;background-color:#c7eaff!important}
.bottomNav{position:sticky!important;bottom:0!important;left:auto!important;right:auto!important;width:100%;max-width:1024px;margin:clamp(18px,3vw,34px) auto 0;grid-template-columns:repeat(3,minmax(0,1fr));align-items:stretch;gap:clamp(7px,1.8vw,18px);padding:clamp(9px,1.6vw,16px) clamp(10px,2.6vw,28px) max(12px,env(safe-area-inset-bottom));border:3px solid #fff;border-bottom:0;border-radius:clamp(28px,5vw,48px) clamp(28px,5vw,48px) 0 0;background:linear-gradient(145deg,#fffdf7ed,#ffe8f7ee 42%,#e6faffed 74%,#fff0dff2)!important;box-shadow:0 -7px 22px #8dcfff6b,0 0 18px #fff inset,0 -2px 0 #ffb4e9 inset!important;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.bottomNav button{position:relative;isolation:isolate;min-width:0;min-height:clamp(68px,9.5vw,94px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:6px 3px;border:2px solid #fff!important;border-radius:28px 28px 22px 22px;background:linear-gradient(145deg,#fffdf9e8,#ffe9f8e8 52%,#e5f9ffe8)!important;color:#71476c!important;font-family:"Wawati TC","華康娃娃體","LXGW WenKai TC","HanziPen TC",cursive!important;font-size:clamp(13px,2.1vw,20px)!important;font-weight:900!important;line-height:1.12;white-space:normal;box-shadow:inset 0 2px 5px #fff,0 4px 10px #8b82bd44,0 0 9px #fff!important;text-shadow:0 1px #fff;transition:transform .18s ease,box-shadow .18s ease,filter .18s ease}
.bottomNav button span{font-size:clamp(25px,4vw,39px)!important;line-height:1.05;filter:drop-shadow(0 2px 2px #fff) drop-shadow(0 0 5px #ffb2e7)}
.bottomNav button[data-view="all"]{border-radius:34px 34px 24px 24px!important;background:linear-gradient(145deg,#fff5bc,#ffbfe9 48%,#baf5ff)!important;color:#e539a1!important;box-shadow:inset 0 2px 7px #fff,0 0 0 2px #fff,0 0 18px #ffb5e4,0 5px 12px #a77ac455!important;transform:translateY(-5px)}
.bottomNav button[data-view="buy"]{background:linear-gradient(145deg,#fff9de,#ffe3b5 52%,#fff2e4)!important;color:#a55524!important}
.bottomNav button[data-view="manage"]{background:linear-gradient(145deg,#f3fdff,#d9f5ff 52%,#f8eaff)!important;color:#536a9a!important}
.bottomNav button:active{transform:translateY(-2px) scale(.97);filter:saturate(1.15)}
@media(max-width:600px){.bottomNav{position:fixed!important;left:50%!important;right:auto!important;bottom:0!important;transform:translateX(-50%);width:100%;margin:0;border-radius:30px 30px 0 0;padding-bottom:max(12px,env(safe-area-inset-bottom));z-index:90}.shell{padding-bottom:calc(104px + env(safe-area-inset-bottom))!important}}
@media(max-width:380px){.bottomNav{gap:5px;padding-left:8px;padding-right:8px}.bottomNav button{min-height:64px;font-size:12px!important;border-radius:22px 22px 18px 18px}.bottomNav button span{font-size:25px!important}}

/* Playful garden ribbon lettering and crystal-glass surfaces */
.brandRibbon{position:absolute!important;overflow:visible!important;padding:clamp(8px,1.2vw,13px) clamp(22px,4vw,42px)!important;border:2px solid #fff9d8!important;border-radius:48% 48% 34% 34% / 36% 36% 58% 58%!important;background:linear-gradient(180deg,#fff9c9 0%,#ffe78f 32%,#ffd26f 61%,#ffc8ee 100%)!important;box-shadow:inset 0 3px 0 #fff,inset 0 -4px 0 #f0b756,0 0 0 2px #fff,0 0 12px #fff4a9,0 5px 0 #df9a44,0 8px 18px #e754b466!important}
.ribbonWords{gap:.015em!important;font-family:"LXGW WenKai TC","Wawati TC","華康娃娃體","HanziPen TC",cursive!important;font-weight:900!important;letter-spacing:.015em!important;filter:drop-shadow(0 1px 1px #a65b42)!important}
.ribbonWords b{font-family:"LXGW WenKai TC","Wawati TC","華康娃娃體","HanziPen TC",cursive!important;font-size:clamp(16px,2.8vw,29px)!important;font-weight:900!important;line-height:1.1!important;-webkit-text-stroke:1.15px #fff9de!important;text-shadow:0 2px 0 #b77b48,0 0 5px #fff,0 0 10px #ffb3d9!important;transform:rotate(var(--tilt,0deg));}
.ribbonWords b:nth-child(4n+1){--tilt:-3deg;color:#f0449b!important;-webkit-text-fill-color:#f0449b!important}
.ribbonWords b:nth-child(4n+2){--tilt:2deg;color:#f58b27!important;-webkit-text-fill-color:#f58b27!important}
.ribbonWords b:nth-child(4n+3){--tilt:-2deg;color:#45afd9!important;-webkit-text-fill-color:#45afd9!important}
.ribbonWords b:nth-child(4n){--tilt:3deg;color:#9b64d8!important;-webkit-text-fill-color:#9b64d8!important}
.ribbonFlower{font-size:clamp(15px,2.4vw,24px)!important;filter:drop-shadow(0 1px 0 #fff) drop-shadow(0 0 5px #ff86cd)}
.card{border:4px solid transparent!important;border-radius:26px!important;background:linear-gradient(145deg,#ffffffbd 0%,#fffaffaa 42%,#e8fbffbb 100%) padding-box,linear-gradient(128deg,#ffffff 0%,#8df4ff 13%,#e5c7ff 27%,#ff9cda 43%,#fff8bb 57%,#85f1ff 72%,#d7baff 86%,#fff 100%) border-box!important;backdrop-filter:blur(8px) saturate(1.22);-webkit-backdrop-filter:blur(8px) saturate(1.22);box-shadow:inset 0 0 0 2px #ffffffd9,inset 0 0 14px #b9f6ff77,0 0 0 1px #ffffffea,0 0 10px #fff,0 0 23px #84eeff77,0 0 28px #ed9cff55,0 8px 22px #526bb044!important;animation:crystalPulse 5.8s ease-in-out infinite alternate}

.bottomNav{background:linear-gradient(135deg,#ffffffa8,#e6faffad 32%,#ffe6f7ac 66%,#fff4d5b8)!important;border-color:#ffffffed!important;box-shadow:0 -6px 26px #8defff55,0 0 0 1px #ffffffd9,0 0 18px #fff inset,0 -3px 0 #c5f6ffb5 inset!important;backdrop-filter:blur(22px) saturate(1.5)!important;-webkit-backdrop-filter:blur(22px) saturate(1.5)!important}

.bottomNav button[data-view="all"]{background:linear-gradient(145deg,#fff8cfcc,#ffd7f2b8 48%,#c9f7ffcc)!important;color:#dc438f!important;box-shadow:inset 0 2px 0 #fff,inset 0 -3px 0 #a6eaff99,0 0 0 2px #fff,0 0 19px #ffb5e6,0 0 22px #83edff77,0 5px 15px #8c6aa044!important}

.bottomNav button span{filter:drop-shadow(0 2px 1px #fff) drop-shadow(0 0 7px #fff) drop-shadow(0 0 9px #8cecff)!important}

async function ocrFlowerName(image){
  if(!window.Tesseract)return '';
  for(const lang of ['chi_tra','chi_sim']){
    try{
      let r=await Tesseract.recognize(image,lang,{langPath:'https://tessdata.projectnaptha.com/4.0.0'});
      let n=extractFlowerName(r.data.text);
      if(n)return n;
    }catch(e){}
  }
  return '';
}
async function recognizeUploadedName(data){

    let name=await ocrFlowerName(data);
    if(!name){
      let im=await new Promise((resolve,reject)=>{let x=new Image();x.onload=()=>resolve(x);x.onerror=reject;x.src=data});
      let cv=document.createElement('canvas'),cx=cv.getContext('2d');cv.width=im.height*2;cv.height=im.width*2;cx.translate(cv.width/2,cv.height/2);cx.rotate(Math.PI/2);cx.drawImage(im,-im.width,-im.height,im.width*2,im.height*2);
      name=await ocrFlowerName(cv.toDataURL('image/png'));

    input.placeholder=name?'已自動帶入花名，可直接修改':'未辨識到花名，請確認後再儲存';
  }catch(e){input.placeholder='未辨識到花名，請確認後再儲存'}
}

function renderBatchOwners(){document.getElementById('batchOwnerChecks').innerHTML=owners.map(o=>'<label class="check"><input type="checkbox" value="'+esc(o)+'">'+esc(o)+'</label>').join('')}function renderBatchList(){document.getElementById('batchList').innerHTML=batchItems.map((b,i)=>'<div class="batchItem"><div class="batchCropStage"><img id="batchCropImage'+i+'" src="'+tempImage+'" alt="第'+(i+1)+'朵花裁切"></div><input id="batchName'+i+'" value="" placeholder="花名辨識中，可直接修改" aria-label="第'+(i+1)+'朵花名"></div>').join('')}function initBatchCroppers(img){batchCroppers.forEach(x=>x.destroy());batchCroppers=[];let specs=[{cx:.5,cy:.42,side:.38},{cx:.26,cy:.68,side:.38},{cx:.74,cy:.68,side:.38}];specs.forEach((s,i)=>{let el=document.getElementById('batchCropImage'+i),cp;cp=new Cropper(el,{viewMode:1,dragMode:'move',aspectRatio:1,autoCropArea:.72,cropBoxResizable:false,background:false,responsive:true,restore:false,zoomable:true,zoomOnWheel:true,ready(){let side=Math.min(img.naturalWidth,img.naturalHeight)*s.side,x=Math.max(0,Math.min(img.naturalWidth-side,s.cx*img.naturalWidth-side/2)),y=Math.max(0,Math.min(img.naturalHeight-side,s.cy*img.naturalHeight-side/2));cp.setData({x,y,width:side,height:side})}});batchCroppers.push(cp)})}function extractFlowerName(text){
  let raw=text||'',ignore=['已售罄','搜尋花朵','搜索花朵','禮包花園','購買個','重新辨識','三種花','花朵圖片','擁有人','訂單價格','訂單經驗','鮮花收穫','收穫間隔','單次收穫','精華掉落','偷取保底','升級','進階','花朵等級','花朵'];

}async function recognizeBatchNames(){let status=document.getElementById('batchStatus');if(!window.Tesseract||!batchCroppers.length){status.textContent='花名辨識服務尚未準備好，請稍後再按一次';return}status.textContent='正在依照三個裁切框重新辨識花名，請稍候…';try{for(let i=0;i<3;i++){let input=document.getElementById('batchName'+i);input.value='';let canvas=batchCroppers[i].getCroppedCanvas({width:900,height:900,imageSmoothingQuality:'high'}),r=await Tesseract.recognize(canvas,'chi_tra'),name=extractFlowerName(r.data.text);batchItems[i].name=name;input.value=name}status.textContent='辨識完成；若有空白或錯字，可直接修改後儲存'}catch(e){status.textContent='辨識未完成，請直接輸入花名後儲存'}}function openBatchFlowers(){if(!tempImage)return;let img=new Image();img.onload=()=>{batchItems=[{name:''},{name:''},{name:''}];renderBatchList();renderBatchOwners();document.getElementById('batchStatus').textContent='請把花盆底部／圖片底線對準每個黃色提示線；裁切框大小不可修改，儲存時保留原圖';document.getElementById('batchModal').classList.add('show');initBatchCroppers(img);setTimeout(()=>recognizeBatchNames(),1200)};img.src=tempImage}function closeBatchFlowers(){batchCroppers.forEach(x=>x.destroy());batchCroppers=[];document.getElementById('batchModal').classList.remove('show')}async function removeBackground(dataUrl,outSize=600){
  return new Promise(resolve=>{
    let im=new Image();

      try{

        for(let z=0;z<q.length;z++){let [x,y]=q[z],n=y*w+x,i=n*4;if(p[i+3]>0)removed++;p[i+3]=0;add(x+1,y);add(x-1,y);add(x,y+1);add(x,y-1)}

        let out=document.createElement('canvas'),ox=out.getContext('2d');out.width=out.height=outSize;ox.clearRect(0,0,outSize,outSize);ox.drawImage(cv,0,0,w,h,0,0,outSize,outSize);resolve(out.toDataURL('image/png'))

}
async function saveBatchFlowers(){let names=[0,1,2].map(i=>document.getElementById('batchName'+i).value.trim());if(names.some(x=>!x))return alert('請確認三個花名都有填寫 🌸');let normalized=names.map(x=>x.toLowerCase());if(new Set(normalized).size!==names.length)return alert('三個花名中有重複，請確認後再儲存 🌸');let duplicate=flowers.find(f=>normalized.includes(String(f.name||'').trim().toLowerCase()));if(duplicate)return alert('已有「'+duplicate.name+'」資料，不能重複新增 🌸');let selected=[...document.querySelectorAll('#batchOwnerChecks input:checked')].map(x=>x.value);for(let i=0;i<3;i++){let b=batchItems[i];b.name=names[i];b.image=batchCroppers[i].getCroppedCanvas({width:600,height:600,imageSmoothingQuality:'high'}).toDataURL('image/jpeg',.92);b.owners=selected;b.id=crypto.randomUUID?crypto.randomUUID():String(Date.now()+i);b.updatedAt=new Date().toISOString();flowers.unshift(b)}persist();batchItems=[];closeBatchFlowers();resetForm();render()}async function saveFlower(){let name=document.getElementById('flowerName').value.trim();if(!name)return alert('請輸入花名 🌸');let duplicate=flowers.find((f,i)=>i!==edit&&String(f.name||'').trim().toLowerCase()===name.toLowerCase());if(duplicate)return alert('已有「'+duplicate.name+'」資料，不能重複新增 🌸');let selected=[...document.querySelectorAll('#ownerChecks input:checked')].map(x=>x.value),old=edit>=0?flowers[edit]:null;if(cropper)tempImage=cropper.getCroppedCanvas({width:600,height:600,imageSmoothingQuality:'high'}).toDataURL('image/jpeg',.92);let obj={id:old&&old.id?old.id:(crypto.randomUUID?crypto.randomUUID():String(Date.now())),name,image:tempImage,owners:selected,updatedAt:new Date().toISOString()};if(edit>=0)flowers[edit]=obj;else flowers.unshift(obj);persist();closeFlower();render()}
function delFlower(i){let f=flowers[i];if(confirm(`確定要刪除「${f.name}」嗎？`)){flowers.splice(i,1);if(f.id&&!deletedFlowerIds.includes(String(f.id)))deletedFlowerIds.push(String(f.id));persist();removeCloud(f.id);render()}}
function openOwners(){setView('manage')}function closeOwners(){setView('all')}function renderOwners(){document.getElementById('ownerList').innerHTML=owners.length?owners.map((o,i)=>`<div class="ownerRow"><span>🌼 ${esc(o)}</span><button class="btn yellow" onclick="renameOwner(${i})">修改</button><button class="btn muted" onclick="removeOwner(${i})">刪除</button></div>`).join(''):'<div class="empty">尚未建立找她買</div>'}
